# ==============================
# Auction House Simulator
# Production Configuration (PostgreSQL on Railway)
# ==============================
# Activate with: SPRING_PRODS_ACTIVE=prod
# DataSource is configured programmatically in DataSourceConfig.java
# (parses Railway's DATABASE_URL automatically)

# Disable H2 console in production
spring.h2.console.enabled=false

# Upload directory (use Railway volume for persistent storage)
app.upload.dir=/app/uploads/profiles

# JPA / Hibernate (datasource is set in DataSourceConfig.java)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings (optimized for Railway)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
