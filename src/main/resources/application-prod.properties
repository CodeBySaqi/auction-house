# ==============================
# Auction House Simulator
# Production Configuration (PostgreSQL on Railway)
# ==============================
# Activate with: SPRING_PRODS_ACTIVE=prod
# DataSource is configured programmatically in DataSourceConfig.java
# (parses Railway's DATABASE_URL automatically)

# Disable H2 console in production
spring.h2.console.enabled=false

# Upload directory (use Railway volume for persistent storage)
app.upload.dir=/app/uploads/profiles

# JPA / Hibernate (datasource is set in DataSourceConfig.java)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Connection pool settings (optimized for Railway)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== PERFORMANCE: Gzip Compression =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# ===== PERFORMANCE: Thymeleaf template caching =====
spring.thymeleaf.cache=true

# ===== PERFORMANCE: Tomcat tuning =====
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.accept-count=100
