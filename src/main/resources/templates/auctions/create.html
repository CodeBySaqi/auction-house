<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Auction — AuctionHouse')}"></head>
<body class="bg-g-bg font-roboto text-g-text min-h-screen flex flex-col">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
    <div class="mb-6">
        <a href="/profile/edit" class="text-sm text-g-blue font-medium hover:underline inline-flex items-center gap-1 mb-4 no-underline">
            <span class="material-icons-outlined text-lg">arrow_back</span> Back to settings
        </a>
        <h1 class="font-gsans text-3xl font-medium text-g-text">Create an auction</h1>
        <p class="text-sm text-g-text-secondary mt-1">List your item and let bidders compete</p>
    </div>

    <div th:if="${error}" class="flex items-center gap-3 p-4 mb-6 bg-red-50 rounded-2xl border border-red-200">
        <span class="material-icons-outlined text-g-red">error</span>
        <span class="text-sm text-red-800" th:text="${error}">Error</span>
    </div>

    <div class="bg-white rounded-3xl border border-g-border p-6 sm:p-8">
        <form action="/auctions/create" method="post" enctype="multipart/form-data" class="space-y-6" id="createAuctionForm">
            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Item title</label>
                <input type="text" name="title" required maxlength="200"
                       class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                       placeholder="e.g. 1967 Ford Mustang Shelby GT500">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Description</label>
                <textarea name="description" required rows="4" maxlength="2000"
                          class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all resize-none"
                          placeholder="Describe your item in detail — condition, history, what makes it special..."></textarea>
            </div>

            <!-- Category + Price -->
            <div class="grid sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Category</label>
                    <select name="category" required class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all">
                        <option value="">Select a category</option>
                        <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}">Category</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Starting price ($)</label>
                    <input type="number" name="startingPrice" required min="1" step="0.01"
                           class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                           placeholder="e.g. 10000">
                </div>
            </div>

            <!-- Image Upload or URL -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Item Image</label>
                <div class="space-y-3">
                    <!-- File Upload -->
                    <div>
                        <label class="block text-xs text-g-text-secondary mb-1">Upload from your device</label>
                        <input type="file" name="auctionImage" accept="image/jpeg,image/png,image/gif,image/webp"
                               class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text file:mr-4 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-g-blue-light file:text-g-blue hover:file:bg-blue-100 transition-all"
                               id="imageFile">
                        <p class="text-xs text-g-text-secondary mt-1">JPEG, PNG, GIF, or WebP. Max 5MB.</p>
                    </div>
                    <!-- Divider -->
                    <div class="flex items-center gap-3">
                        <div class="flex-1 border-t border-g-border"></div>
                        <span class="text-xs text-g-text-secondary font-medium">OR</span>
                        <div class="flex-1 border-t border-g-border"></div>
                    </div>
                    <!-- URL -->
                    <div>
                        <label class="block text-xs text-g-text-secondary mb-1">Paste an image URL</label>
                        <input type="url" name="imageUrl" id="imageUrl"
                               class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                               placeholder="https://example.com/your-item-photo.jpg">
                        <p class="text-xs text-g-text-secondary mt-1">Try <a href="https://unsplash.com" target="_blank" class="text-g-blue hover:underline">unsplash.com</a> for free photos</p>
                    </div>
                </div>
            </div>

            <!-- Duration -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Auction duration</label>
                <select name="durationMinutes" required class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all">
                    <option value="15">15 minutes ⚡</option>
                    <option value="30">30 minutes</option>
                    <option value="45">45 minutes</option>
                    <option value="60" selected>1 hour</option>
                </select>
                <p class="text-xs text-g-text-secondary mt-1.5">Shorter auctions = more urgency = higher bids!</p>
            </div>

            <!-- Submit -->
            <div class="pt-4 border-t border-g-border flex flex-wrap gap-3">
                <button type="submit" class="inline-flex items-center gap-2 px-8 py-3.5 bg-g-blue text-white font-medium rounded-full hover:bg-g-blue-hover text-sm transition-colors shadow-g-sm">
                    <span class="material-icons-outlined text-lg">gavel</span>
                    Launch Auction
                </button>
                <a href="/auctions" class="inline-flex items-center gap-2 px-6 py-3.5 bg-white text-g-text font-medium rounded-full border border-g-border hover:bg-g-hover text-sm transition-colors no-underline">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
document.getElementById('createAuctionForm').addEventListener('submit', function(e) {
    const fileInput = document.getElementById('imageFile');
    const urlInput = document.getElementById('imageUrl');
    const hasFile = fileInput.files && fileInput.files.length > 0;
    const hasUrl = urlInput.value.trim() !== '';

    if (!hasFile && !hasUrl) {
        e.preventDefault();
        alert('Please upload an image or paste an image URL.');
        return false;
    }
});
</script>
</body>
</html>
