<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Ticket ' + ${ticket.ticketNumber} + ' - Admin'">Ticket - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script th:replace="~{fragments/layout :: tailwindConfig}"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', system-ui, sans-serif; }
        .font-gsans { font-family: 'Google Sans', 'Roboto', system-ui, sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-g-bg font-roboto text-g-text h-screen overflow-hidden flex flex-col">

        <!-- App Bar -->
    <nav th:replace="~{fragments/admin-header :: adminHeader}"></nav>

    <!-- Main Layout -->
    <div class="max-w-[1680px] mx-auto flex flex-1 overflow-hidden w-full">
        <aside th:replace="~{fragments/admin-sidebar :: sidebar('support')}"></aside>
        <div th:replace="~{fragments/admin-sidebar :: mobile-nav('support')}"></div>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 flex flex-col" style="max-height: calc(100vh - 64px);">

            <!-- Ticket Info -->
            <div class="bg-white rounded-2xl border border-g-border p-5 mb-4 flex-shrink-0">
                <div class="flex flex-wrap items-start justify-between gap-4">
                    <div>
                        <h1 class="font-gsans font-medium text-g-text text-lg" th:text="${ticket.subject}">Subject</h1>
                        <div class="flex items-center gap-3 mt-2 flex-wrap">
                            <span class="text-xs text-g-text-secondary">By <span class="font-medium text-g-text" th:text="${ticket.user.username}">User</span></span>
                            <span class="text-xs text-g-text-secondary" th:text="${ticket.user.email}">email</span>
                            <span class="px-2 py-0.5 bg-g-bg rounded-full text-[10px] font-medium text-g-text-secondary" th:text="${ticket.category.displayName}">Category</span>
                            <span class="text-xs text-g-text-secondary">Created <span th:text="${ticket.getCreatedFormatted()}">Jan 1</span></span>
                        </div>
                    </div>
                    <div th:if="${ticket.assignedAdmin != null}" class="text-right">
                        <p class="text-xs text-g-text-secondary">Assigned to</p>
                        <p class="text-sm font-medium text-g-text" th:text="${ticket.assignedAdmin.username}">Admin</p>
                    </div>
                </div>
                <!-- Flash messages -->
                <div th:if="${success}" class="mt-3 p-3 bg-green-50 rounded-xl border border-green-200 text-sm text-green-800" th:text="${success}"></div>
                <div th:if="${error}" class="mt-3 p-3 bg-red-50 rounded-xl border border-red-200 text-sm text-red-800" th:text="${error}"></div>
            </div>

            <!-- Conversation -->
            <div class="bg-white rounded-2xl border border-g-border flex-1 flex flex-col overflow-hidden" style="min-height: 300px;">
                <!-- Messages -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                    <div th:each="msg : ${messages}" class="flex" th:classappend="${msg.senderRole == 'ADMIN'} ? 'justify-end' : 'justify-start'">
                        <!-- User message (left for admin) -->
                        <div th:if="${msg.senderRole == 'USER'}" class="max-w-[80%]">
                            <div class="flex items-center gap-2 mb-1">
                                <div class="w-6 h-6 rounded-full bg-purple-500 flex items-center justify-center text-white text-[10px] font-medium"
                                     th:text="${#strings.substring(msg.sender.username, 0, 1).toUpperCase()}">U</div>
                                <span class="text-xs font-medium text-g-text" th:text="${msg.sender.username}">User</span>
                                <span class="text-[10px] text-g-text-secondary" th:text="${msg.getFormattedDateTime()}">Time</span>
                            </div>
                            <div class="bg-g-bg border border-g-border rounded-2xl rounded-tl-sm px-4 py-3">
                                <p class="text-sm text-g-text whitespace-pre-wrap" th:text="${msg.content}">Message</p>
                            </div>
                        </div>
                        <!-- Admin message (right for admin) -->
                        <div th:unless="${msg.senderRole == 'USER'}" class="max-w-[80%]">
                            <div class="flex items-center gap-2 mb-1 justify-end">
                                <span class="text-[10px] text-g-text-secondary" th:text="${msg.getFormattedDateTime()}">Time</span>
                                <span class="text-xs font-medium text-g-text" th:text="${msg.sender.username}">Admin</span>
                                <div class="w-6 h-6 rounded-full bg-g-blue flex items-center justify-center text-white text-[10px] font-medium">A</div>
                            </div>
                            <div class="bg-g-blue text-white rounded-2xl rounded-tr-sm px-4 py-3">
                                <p class="text-sm whitespace-pre-wrap" th:text="${msg.content}">Message</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Message Input -->
                <div class="border-t border-g-border p-4 flex-shrink-0" th:if="${ticket.status.name() != 'CLOSED'}">
                    <form id="messageForm" th:action="@{'/admin/support/' + ${ticket.id} + '/reply'}" method="post" class="flex gap-3">
                        <input type="text" name="content" id="messageInput" autocomplete="off" maxlength="2000"
                               class="flex-1 px-4 py-3 bg-g-bg border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                               placeholder="Type your reply...">
                        <button type="submit" id="sendBtn"
                                class="px-5 py-3 bg-g-blue text-white font-medium rounded-xl hover:bg-g-blue-hover text-sm transition-colors flex items-center gap-2">
                            <span class="material-icons-outlined text-lg">send</span>
                        </button>
                    </form>
                </div>
                <div th:if="${ticket.status.name() == 'CLOSED'}" class="border-t border-g-border p-4 flex-shrink-0 text-center">
                    <p class="text-sm text-g-text-secondary">
                        <span class="material-icons-outlined text-base align-middle">lock</span>
                        This ticket is closed
                    </p>
                </div>
            </div>
        </main>
    </div>

<!-- WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
(function() {
    const ticketId = /*[[${ticket.id}]]*/ 0;
    const currentUsername = /*[[${admin.username}]]*/ '';
    const ticketStatus = /*[[${ticket.status.name()}]]*/ 'OPEN';

    const messagesContainer = document.getElementById('messagesContainer');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Scroll to bottom on load
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    if (ticketStatus === 'CLOSED') return;

    let stompClient = null;
    let connected = false;

    function connectWebSocket() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function() {
            connected = true;
            stompClient.subscribe('/topic/ticket/' + ticketId, function(msg) {
                const data = JSON.parse(msg.body);
                appendMessage(data);
            });
            stompClient.subscribe('/user/queue/errors', function(msg) {
                const data = JSON.parse(msg.body);
                alert('Error: ' + data.message);
                if (sendBtn) sendBtn.disabled = false;
            });
        }, function() {
            connected = false;
            setTimeout(connectWebSocket, 3000);
        });
    }

    function appendMessage(data) {
        const isMine = data.senderUsername === currentUsername;
        const time = new Date(data.timestamp);
        const timeStr = time.toLocaleString('en-US', { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
        const esc = function(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

        const wrapper = document.createElement('div');
        wrapper.className = 'flex ' + (isMine ? 'justify-end' : 'justify-start');

        if (isMine) {
            wrapper.innerHTML = '<div class="max-w-[80%]">'
                + '<div class="flex items-center gap-2 mb-1 justify-end">'
                + '<span class="text-[10px] text-g-text-secondary">' + timeStr + '</span>'
                + '<span class="text-xs font-medium text-g-text">' + esc(data.senderUsername) + '</span>'
                + '<div class="w-6 h-6 rounded-full bg-g-blue flex items-center justify-center text-white text-[10px] font-medium">A</div>'
                + '</div>'
                + '<div class="bg-g-blue text-white rounded-2xl rounded-tr-sm px-4 py-3">'
                + '<p class="text-sm whitespace-pre-wrap">' + esc(data.content) + '</p></div></div>';
        } else {
            wrapper.innerHTML = '<div class="max-w-[80%]">'
                + '<div class="flex items-center gap-2 mb-1">'
                + '<div class="w-6 h-6 rounded-full bg-purple-500 flex items-center justify-center text-white text-[10px] font-medium">' + esc(data.senderUsername.charAt(0).toUpperCase()) + '</div>'
                + '<span class="text-xs font-medium text-g-text">' + esc(data.senderUsername) + '</span>'
                + '<span class="text-[10px] text-g-text-secondary">' + timeStr + '</span>'
                + '</div>'
                + '<div class="bg-g-bg border border-g-border rounded-2xl rounded-tl-sm px-4 py-3">'
                + '<p class="text-sm text-g-text whitespace-pre-wrap">' + esc(data.content) + '</p></div></div>';
        }

        messagesContainer.appendChild(wrapper);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    if (messageForm) {
        messageForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const content = messageInput.value.trim();
            if (!content) return;
            sendBtn.disabled = true;
            messageInput.value = '';
            if (connected && stompClient) {
                stompClient.send('/app/ticket.send', {}, JSON.stringify({ ticketId: ticketId, content: content }));
            } else {
                messageForm.submit();
            }
            setTimeout(function() { sendBtn.disabled = false; }, 1000);
        });
    }

    if (messageInput) {
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                messageForm.dispatchEvent(new Event('submit'));
            }
        });
    }

    connectWebSocket();
})();

// Status menu close on outside click
document.addEventListener('click', function(e) {
    var menu = document.getElementById('statusMenu');
    if (menu && !e.target.closest('#statusMenu') && !e.target.closest('button')) {
        menu.classList.add('hidden');
    }
});
</script>
    <div th:replace="~{fragments/admin-header :: adminHeaderScripts}"></div>
</body>
</html>
