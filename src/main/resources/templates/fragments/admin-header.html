<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Admin Top Header Fragment -->
<!-- Usage: <nav th:replace="~{fragments/admin-header :: adminHeader}"></nav> -->
<!-- Uses GlobalModelAdvice: ${currentUser} and ${unreadCount} are auto-injected -->
<nav th:fragment="adminHeader" class="bg-white border-b border-g-border sticky top-0 z-40 flex-shrink-0">
    <div class="max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-g-blue rounded-xl flex items-center justify-center">
                    <span class="material-icons-outlined text-white text-xl">gavel</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-gsans font-medium text-xl text-g-text">Auction<span class="text-g-blue">House</span></span>
                    <span class="px-2.5 py-1 bg-g-text text-white text-[10px] font-bold uppercase tracking-wider rounded-md">Admin</span>
                </div>
            </div>

            <!-- Search -->
            <div class="hidden md:flex flex-1 max-w-xl mx-8">
                <form th:action="@{/admin/search}" method="get" class="relative w-full">
                    <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-g-text-secondary">search</span>
                    <input type="text" name="q" placeholder="Search users, auctions, bids..."
                           class="w-full pl-11 pr-4 py-2.5 bg-g-bg border border-g-border rounded-full text-sm placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:bg-white focus:shadow-g-sm transition-all">
                </form>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-2">
                <!-- Notification Bell + Popover -->
                <div class="relative" id="notifBell">
                    <button onclick="toggleNotifPopover()" class="relative p-2 rounded-full text-g-text-secondary hover:bg-g-hover transition-colors">
                        <span class="material-icons-outlined">notifications</span>
                        <span id="notifBadge" th:if="${unreadCount > 0}" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-g-red rounded-full text-[10px] text-white font-medium flex items-center justify-center" th:text="${unreadCount}">0</span>
                    </button>
                    <div id="notifPopover" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-g-xl border border-g-border z-50 overflow-hidden">
                        <div class="px-4 py-3 border-b border-g-border flex items-center justify-between">
                            <h3 class="font-gsans font-medium text-sm text-g-text">Notifications</h3>
                            <span id="notifUnreadLabel" class="text-[10px] font-semibold text-g-blue bg-g-blue-light px-2 py-0.5 rounded-full hidden">0 new</span>
                        </div>
                        <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-g-border scrollbar-hide">
                            <div id="notifLoading" class="p-6 text-center">
                                <div class="w-6 h-6 border-2 border-g-blue border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                                <p class="text-xs text-g-text-secondary">Loading...</p>
                            </div>
                        </div>
                        <div class="border-t border-g-border px-4 py-2.5">
                            <a th:href="@{/notifications}" class="flex items-center justify-center gap-1.5 text-sm font-medium text-g-blue hover:text-g-blue-hover transition-colors py-1">
                                View all notifications <span class="material-icons-outlined text-base">arrow_forward</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <a th:href="@{/admin/settings}" class="p-2 rounded-full text-g-text-secondary hover:bg-g-hover transition-colors">
                    <span class="material-icons-outlined">settings</span>
                </a>

                <!-- Profile Dropdown -->
                <div class="relative">
                    <button onclick="toggleProfileDropdown()" class="w-9 h-9 rounded-full bg-g-blue flex items-center justify-center text-white font-medium text-sm hover:shadow-g-sm transition-shadow cursor-pointer">
                        <span th:text="${currentUser != null ? currentUser.username.substring(0,1).toUpperCase() : 'A'}">A</span>
                    </button>
                    <div id="profileDropdown" class="hidden absolute right-0 top-12 w-56 bg-white border border-g-border rounded-2xl shadow-g-lg z-50 py-2">
                        <div class="px-4 py-3 border-b border-g-border mb-1">
                            <p class="text-sm font-medium text-g-text" th:text="${currentUser != null ? currentUser.username : 'Admin'}">Admin User</p>
                            <p class="text-xs text-g-text-secondary truncate" th:text="${currentUser != null ? currentUser.email : ''}">admin@auctionhouse.com</p>
                        </div>
                        <a th:href="@{/profile/edit}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-g-text hover:bg-g-hover transition-colors">
                            <span class="material-icons-outlined text-lg text-g-text-secondary">person</span>
                            My Profile
                        </a>
                        <a th:href="@{/}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-g-text hover:bg-g-hover transition-colors">
                            <span class="material-icons-outlined text-lg text-g-text-secondary">home</span>
                            View Site
                        </a>
                        <div class="border-t border-g-border my-1"></div>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="flex items-center gap-3 px-4 py-2.5 text-sm text-g-red hover:bg-red-50 transition-colors w-full">
                                <span class="material-icons-outlined text-lg">logout</span>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Admin Header Scripts (notification popover + profile dropdown JS) -->
<div th:fragment="adminHeaderScripts">
<script>
    function toggleProfileDropdown() {
        document.getElementById('profileDropdown').classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        // Profile dropdown
        var profileBtn = event.target.closest('button[onclick="toggleProfileDropdown()"]');
        var profileDD = document.getElementById('profileDropdown');
        if (profileDD && !profileBtn && !profileDD.contains(event.target)) {
            profileDD.classList.add('hidden');
        }
        // Notification popover
        var bell = document.getElementById('notifBell');
        var popover = document.getElementById('notifPopover');
        if (bell && popover && !bell.contains(event.target)) {
            popover.classList.add('hidden');
        }
    });

    // Notification Popover
    var notifLoaded = false;
    function toggleNotifPopover() {
        var popover = document.getElementById('notifPopover');
        var isOpen = !popover.classList.contains('hidden');
        popover.classList.toggle('hidden');
        if (!isOpen) {
            // Opening the popover — fetch notifications and mark as read
            fetchNotifications();
            markAllNotificationsRead();
        }
    }

    function markAllNotificationsRead() {
        // Hide badge immediately for instant feedback
        var badge = document.getElementById('notifBadge');
        if (badge) badge.style.display = 'none';
        var label = document.getElementById('notifUnreadLabel');
        if (label) label.classList.add('hidden');

        // Get CSRF token if available
        var csrfMeta = document.querySelector('meta[name="_csrf"]');
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]');
        var headers = {};
        if (csrfMeta && csrfHeader) {
            headers[csrfHeader.getAttribute('content')] = csrfMeta.getAttribute('content');
        }

        fetch('/api/notifications/mark-all-read', { method: 'POST', headers: headers })
            .catch(function() {}); // Silent fail — badge already hidden
    }

    function fetchNotifications() {
        var list = document.getElementById('notifList');
        var loading = document.getElementById('notifLoading');
        if (loading) loading.style.display = 'block';
        fetch('/api/notifications/recent')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                notifLoaded = true;
                if (loading) loading.style.display = 'none';
                renderNotifications(data.notifications, data.unreadCount);
                // Since we mark all as read on open, force badge to 0
                var badge = document.getElementById('notifBadge');
                if (badge) badge.style.display = 'none';
                var label = document.getElementById('notifUnreadLabel');
                if (label) label.classList.add('hidden');
            })
            .catch(function() {
                if (loading) loading.innerHTML = '<p class="text-xs text-g-red">Failed to load</p>';
            });
    }

    function renderNotifications(notifications, unreadCount) {
        var list = document.getElementById('notifList');
        if (!list) return;
        list.querySelectorAll('.notif-item').forEach(function(el) { el.remove(); });
        if (!notifications || notifications.length === 0) {
            list.insertAdjacentHTML('beforeend',
                '<div class="notif-item p-6 text-center">' +
                '<span class="material-icons-outlined text-g-text-secondary text-3xl">notifications_none</span>' +
                '<p class="text-sm text-g-text-secondary mt-2">All caught up!</p></div>');
            return;
        }
        notifications.forEach(function(n) {
            var iconBg = n.type === 'WON' ? 'bg-green-100' : (n.type === 'OUTBID' ? 'bg-red-100' : (n.type === 'REFUND' ? 'bg-amber-100' : (n.type === 'SUPPORT' ? 'bg-indigo-100' : 'bg-blue-100')));
            var iconColor = n.type === 'WON' ? 'text-g-green' : (n.type === 'OUTBID' ? 'text-g-red' : (n.type === 'REFUND' ? 'text-amber-600' : (n.type === 'SUPPORT' ? 'text-indigo-600' : 'text-g-blue')));
            var icon = n.type === 'WON' ? 'emoji_events' : (n.type === 'OUTBID' ? 'trending_down' : (n.type === 'REFUND' ? 'payments' : (n.type === 'SUPPORT' ? 'support_agent' : 'campaign')));
            var isUnread = !n.read;
            var clickTarget = n.type === 'SUPPORT' ? 'window.location=\'/support\'' : (n.auctionId ? 'window.location=\'/auctions/detail/' + n.auctionId + '\'' : '');
            var html = '<div class="notif-item px-4 py-3 flex items-start gap-3 hover:bg-g-hover transition-colors cursor-pointer' + (isUnread ? ' bg-blue-50/40' : '') + '"' +
                (clickTarget ? ' onclick="' + clickTarget + '"' : '') + '>' +
                '<div class="w-8 h-8 rounded-full shrink-0 flex items-center justify-center ' + iconBg + '">' +
                '<span class="material-icons-outlined text-base ' + iconColor + '">' + icon + '</span></div>' +
                '<div class="flex-1 min-w-0">' +
                '<p class="text-xs leading-relaxed line-clamp-2 ' + (isUnread ? 'font-medium text-g-text' : 'text-g-text-secondary') + '">' + escapeAdminHtml(n.message) + '</p>' +
                '<p class="text-[10px] text-g-text-secondary mt-1">' + n.timeAgo + '</p></div>' +
                (isUnread ? '<span class="w-2 h-2 bg-g-blue rounded-full shrink-0 mt-1.5"></span>' : '') +
                '</div>';
            list.insertAdjacentHTML('beforeend', html);
        });
    }

    function escapeAdminHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</div>

</body>
</html>
