<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Tickets — AuctionHouse')}"></head>
<body class="bg-g-bg font-roboto text-g-text min-h-screen flex flex-col">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="font-gsans text-2xl font-medium text-g-text">My Support Tickets</h1>
            <p class="text-sm text-g-text-secondary mt-1" th:text="${tickets.size()} + ' total tickets'">0 tickets</p>
        </div>
        <a href="/support/create" class="inline-flex items-center gap-2 px-5 py-2.5 bg-g-blue text-white font-medium rounded-full hover:bg-g-blue-hover text-sm transition-colors shadow-g-sm no-underline">
            <span class="material-icons-outlined text-lg">add</span>
            New Ticket
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${tickets.isEmpty()}" class="bg-white rounded-3xl border border-g-border p-12 text-center">
        <div class="w-20 h-20 mx-auto mb-4 bg-g-bg rounded-full flex items-center justify-center border border-g-border">
            <span class="material-icons-outlined text-g-text-secondary text-4xl">support_agent</span>
        </div>
        <h3 class="font-gsans text-xl font-medium text-g-text mb-2">No support tickets yet</h3>
        <p class="text-sm text-g-text-secondary mb-6">Need help with something? Create a support ticket and we'll get back to you.</p>
        <a href="/support/create" class="inline-flex items-center gap-2 px-6 py-3 bg-g-blue text-white font-medium rounded-full hover:bg-g-blue-hover text-sm transition-colors shadow-g-sm no-underline">
            <span class="material-icons-outlined text-lg">add</span>
            Contact Support
        </a>
    </div>

    <!-- Ticket List -->
    <div class="space-y-3" th:if="${!tickets.isEmpty()}">
        <a th:each="ticket : ${tickets}" th:href="@{'/support/' + ${ticket.id}}"
           class="block bg-white rounded-2xl border p-5 hover:shadow-g-md hover:border-g-blue/30 transition-all no-underline group">
            <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-mono text-g-text-secondary" th:text="${ticket.ticketNumber}">#10001</span>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase"
                              th:classappend="${ticket.status.name() == 'OPEN'} ? 'bg-blue-100 text-blue-700' :
                                              (${ticket.status.name() == 'IN_PROGRESS'} ? 'bg-amber-100 text-amber-700' :
                                              (${ticket.status.name() == 'RESOLVED'} ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'))"
                              th:text="${ticket.status.displayName}">Status</span>
                        <span class="px-2 py-0.5 bg-g-bg rounded-full text-[10px] font-medium text-g-text-secondary" th:text="${ticket.category.displayName}">Category</span>
                    </div>
                    <h3 class="font-gsans font-medium text-g-text text-sm mb-1 line-clamp-1 group-hover:text-g-blue transition-colors" th:text="${ticket.subject}">Subject</h3>
                    <p class="text-xs text-g-text-secondary line-clamp-1" th:text="${ticket.getLastMessagePreview()}">Last message preview</p>
                </div>
                <div class="text-right flex-shrink-0">
                    <p class="text-xs text-g-text-secondary" th:text="${ticket.getTimeAgo()}">2m ago</p>
                    <div th:if="${ticket.getUnreadCountForUser(currentUser.id) > 0}"
                         class="inline-flex items-center gap-1 mt-2 px-2 py-0.5 bg-g-blue-light rounded-full">
                        <span class="w-1.5 h-1.5 bg-g-blue rounded-full"></span>
                        <span class="text-[10px] font-semibold text-g-blue" th:text="${ticket.getUnreadCountForUser(currentUser.id)} + ' new'">1 new</span>
                    </div>
                </div>
            </div>
        </a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
