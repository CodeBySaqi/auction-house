<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Contact Support — AuctionHouse')}"></head>
<body class="bg-g-bg font-roboto text-g-text min-h-screen flex flex-col">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <!-- Back link -->
    <a th:href="@{/support}" class="inline-flex items-center gap-1 text-sm text-g-text-secondary hover:text-g-blue transition-colors mb-6 no-underline">
        <span class="material-icons-outlined text-lg">arrow_back</span>
        My Tickets
    </a>

    <div class="bg-white rounded-3xl border border-g-border p-8 sm:p-10">
        <div class="text-center mb-8">
            <div class="w-12 h-12 mx-auto mb-4 bg-g-blue rounded-2xl flex items-center justify-center">
                <span class="material-icons-outlined text-white text-2xl">support_agent</span>
            </div>
            <h1 class="font-gsans text-2xl font-medium text-g-text">Contact Support</h1>
            <p class="text-sm text-g-text-secondary mt-1">We'll get back to you as soon as possible</p>
        </div>

        <!-- Warning about existing open tickets -->
        <div th:if="${openTicketCount > 0}" class="flex items-start gap-3 p-4 mb-6 bg-amber-50 rounded-2xl border border-amber-200">
            <span class="material-icons-outlined text-amber-600 text-xl mt-0.5">info</span>
            <div>
                <p class="text-sm font-medium text-amber-800">You have <span th:text="${openTicketCount}">1</span> open ticket(s)</p>
                <p class="text-xs text-amber-700 mt-0.5">Check <a th:href="@{/support}" class="underline font-medium">your existing tickets</a> before creating a new one.</p>
            </div>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="flex items-center gap-3 p-4 mb-6 bg-red-50 rounded-2xl border border-red-200">
            <span class="material-icons-outlined text-g-red text-xl">error</span>
            <span class="text-sm text-red-800" th:text="${error}">Error</span>
        </div>

        <form th:action="@{/support/create}" method="post" class="space-y-5">
            <!-- Subject -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Subject</label>
                <input type="text" name="subject" required maxlength="200"
                       th:value="${subject}"
                       class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                       placeholder="Brief description of your issue">
            </div>

            <!-- Category -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Category</label>
                <select name="category" required
                        class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all">
                    <option value="">Select a category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}"
                            th:selected="${category != null and category == cat.name()}">Category</option>
                </select>
            </div>

            <!-- Message -->
            <div>
                <label class="block text-sm font-medium text-g-text mb-1.5">Description</label>
                <textarea name="message" required maxlength="2000" rows="6"
                          class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all resize-none"
                          placeholder="Describe your issue in detail..." th:text="${message}"></textarea>
                <p class="text-xs text-g-text-secondary mt-1">Max 2,000 characters</p>
            </div>

            <button type="submit" id="submitTicketBtn" class="w-full py-3.5 bg-g-blue text-white font-medium rounded-xl hover:bg-g-blue-hover shadow-g-sm hover:shadow-g-md transition-all text-sm flex items-center justify-center gap-2">
                <span class="material-icons-outlined text-lg">send</span>
                Submit Ticket
            </button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // Prevent double-submit on ticket creation
    var submitBtn = document.getElementById('submitTicketBtn');
    if (submitBtn) {
        submitBtn.closest('form').addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-icons-outlined text-lg animate-spin">hourglass_top</span> Submitting...';
        });
    }
</script>
</body>
</html>
