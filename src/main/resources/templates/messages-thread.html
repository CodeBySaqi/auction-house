<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chat with ' + ${otherUser.username} + ' — AuctionHouse'">Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script th:replace="~{fragments/layout :: tailwindConfig}"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', system-ui, sans-serif; }
        .font-gsans { font-family: 'Google Sans', 'Roboto', system-ui, sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 999px; }
        .msg-bubble-mine { border-radius: 18px 18px 4px 18px; }
        .msg-bubble-theirs { border-radius: 18px 18px 18px 4px; }
    </style>
</head>
<body class="bg-g-bg h-screen flex flex-col overflow-hidden">

    <!-- Navbar (compact) -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Chat Header -->
    <div class="bg-white border-b border-g-border px-4 sm:px-6 py-3 flex items-center gap-3 flex-shrink-0">
        <a href="/messages" class="p-2 -ml-2 rounded-full text-g-text-secondary hover:bg-g-hover transition-colors">
            <span class="material-icons-outlined">arrow_back</span>
        </a>
        <div class="w-10 h-10 rounded-full bg-g-blue flex items-center justify-center shrink-0 overflow-hidden">
            <img th:if="${otherUser != null and otherUser.hasProfilePic()}"
                 th:src="${otherUser.profilePicPath.startsWith('http')} ? @{${otherUser.profilePicPath}} : @{'/uploads/' + ${otherUser.profilePicPath}}"
                 class="w-full h-full object-cover" alt="">
            <span th:unless="${otherUser != null and otherUser.hasProfilePic()}" class="text-white font-gsans font-medium text-base" th:text="${otherUser != null ? otherUser.username.substring(0,1).toUpperCase() : '?'}">U</span>
        </div>
        <div class="flex-1 min-w-0">
            <p class="font-gsans font-medium text-g-text truncate" th:text="${otherUser != null ? otherUser.username : 'Unknown'}">User</p>
            <p class="text-[11px] text-g-text-secondary" th:if="${conversation.directMessage}">Direct message</p>
            <p class="text-[11px] text-g-text-secondary" th:unless="${conversation.directMessage}" th:text="'Auction: ' + ${conversation.auction != null ? conversation.auction.title : ''}">Auction</p>
        </div>
        <a th:href="@{'/auctions/detail/' + ${conversation.auction.id}}" th:if="${conversation.auction != null}" class="p-2 rounded-full text-g-text-secondary hover:bg-g-hover transition-colors" title="View auction">
            <span class="material-icons-outlined text-lg">gavel</span>
        </a>
    </div>

    <!-- Messages Container -->
    <div id="chat-messages" class="flex-1 overflow-y-auto px-4 sm:px-6 py-4 space-y-3 scrollbar-thin">
        <!-- Date separator for first message -->
        <div th:if="${messages.isEmpty()}" class="flex items-center justify-center h-full">
            <div class="text-center">
                <span class="material-icons-outlined text-5xl text-g-text-secondary/30 mb-3">chat_bubble_outline</span>
                <p class="text-sm text-g-text-secondary font-medium">No messages yet</p>
                <p class="text-xs text-g-text-secondary mt-1">Send a message to start the conversation</p>
            </div>
        </div>

        <div th:each="msg, iterStat : ${messages}">
            <!-- Date separator (show when date changes) -->
            <div th:if="${iterStat.first or #temporals.format(msg.createdAt, 'yyyy-MM-dd') != #temporals.format(messages[iterStat.index - 1].createdAt, 'yyyy-MM-dd')}"
                 class="flex items-center gap-3 my-4">
                <div class="flex-1 border-t border-g-border"></div>
                <span class="text-[11px] font-medium text-g-text-secondary px-2" th:text="${#temporals.format(msg.createdAt, 'MMM d, yyyy')}">Jan 1</span>
                <div class="flex-1 border-t border-g-border"></div>
            </div>

            <!-- Message bubble -->
            <div th:classappend="${msg.sender.id == currentUser.id} ? 'flex justify-end' : 'flex justify-start'">
                <div th:classappend="${msg.sender.id == currentUser.id} ? 'msg-bubble-mine bg-g-blue text-white max-w-[75%] sm:max-w-[60%] px-4 py-2.5' : 'msg-bubble-theirs bg-white border border-g-border text-g-text max-w-[75%] sm:max-w-[60%] px-4 py-2.5'">
                    <p class="text-sm leading-relaxed break-words whitespace-pre-wrap" th:text="${msg.content}">Message</p>
                    <p th:classappend="${msg.sender.id == currentUser.id} ? 'text-[10px] text-white/70 mt-1 text-right' : 'text-[10px] text-g-text-secondary mt-1 text-right'" th:text="${#temporals.format(msg.createdAt, 'h:mm a')}">12:00</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Input -->
    <div class="bg-white border-t border-g-border px-4 sm:px-6 py-3 flex-shrink-0">
        <form id="chat-form" class="flex gap-3">
            <input
                type="text"
                id="chat-input"
                placeholder="Type a message..."
                maxlength="2000"
                autocomplete="off"
                class="emoji-enabled flex-1 px-4 py-3 bg-g-bg border border-g-border rounded-full text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                required>
            <button type="submit" id="sendBtn"
                    class="w-11 h-11 bg-g-blue text-white rounded-full flex items-center justify-center hover:bg-g-blue-hover shadow-g-sm transition-all shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                <span class="material-icons-outlined text-lg">send</span>
            </button>
        </form>
    </div>

    <!-- Hidden data -->
    <input type="hidden" id="conversation-id" th:value="${conversation.id}">
    <input type="hidden" id="current-username" th:value="${currentUser.username}">
    <input type="hidden" id="csrf-token" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <!-- Emoji Picker -->
    <script th:src="@{/js/emoji-picker.js}"></script>
    <!-- SockJS and STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
    (function() {
        const conversationId = document.getElementById('conversation-id').value;
        const currentUsername = document.getElementById('current-username').value;
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('sendBtn');

        // Scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        // Initial scroll
        setTimeout(scrollToBottom, 100);

        // Add a message bubble to the DOM
        function addMessage(data) {
            // Remove empty state if present
            const empty = chatMessages.querySelector('.flex.items-center.justify-center.h-full');
            if (empty) empty.remove();

            const isMine = data.senderUsername === currentUsername;
            const time = new Date(data.timestamp).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});

            const wrapper = document.createElement('div');
            wrapper.className = isMine ? 'flex justify-end' : 'flex justify-start';

            const bubble = document.createElement('div');
            if (isMine) {
                bubble.className = 'msg-bubble-mine bg-g-blue text-white max-w-[75%] sm:max-w-[60%] px-4 py-2.5';
            } else {
                bubble.className = 'msg-bubble-theirs bg-white border border-g-border text-g-text max-w-[75%] sm:max-w-[60%] px-4 py-2.5';
            }

            const p = document.createElement('p');
            p.className = 'text-sm leading-relaxed break-words whitespace-pre-wrap';
            p.textContent = data.content;

            const ts = document.createElement('p');
            ts.className = isMine ? 'text-[10px] text-white/70 mt-1 text-right' : 'text-[10px] text-g-text-secondary mt-1 text-right';
            ts.textContent = time;

            bubble.appendChild(p);
            bubble.appendChild(ts);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            scrollToBottom();
        }

        // WebSocket connection
        let stompClient = null;
        let connected = false;

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Suppress console logs

            stompClient.connect({}, function() {
                connected = true;

                // Subscribe to conversation
                stompClient.subscribe('/topic/chat/' + conversationId, function(msg) {
                    const data = JSON.parse(msg.body);
                    addMessage(data);
                });

                // Listen for errors
                stompClient.subscribe('/user/queue/errors', function(msg) {
                    const err = JSON.parse(msg.body);
                    alert(err.message || 'An error occurred');
                });
            }, function() {
                connected = false;
                // Retry after 3 seconds
                setTimeout(connect, 3000);
            });
        }

        connect();

        // Send message
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const content = chatInput.value.trim();
            if (!content) return;

            if (connected && stompClient) {
                stompClient.send('/app/chat.send', {}, JSON.stringify({
                    conversationId: parseInt(conversationId),
                    content: content
                }));
                chatInput.value = '';
                chatInput.focus();
            } else {
                // Fallback: HTTP POST (will reload)
                const csrfInput = document.getElementById('csrf-token');
                const form = document.createElement('form');
                form.method = 'post';
                form.action = '/chat/' + conversationId + '/send';
                const contentInput = document.createElement('input');
                contentInput.name = 'content';
                contentInput.value = content;
                form.appendChild(contentInput);
                if (csrfInput) {
                    const csrf = document.createElement('input');
                    csrf.name = csrfInput.name;
                    csrf.value = csrfInput.value;
                    form.appendChild(csrf);
                }
                document.body.appendChild(form);
                form.submit();
            }
        });

        // Focus input
        chatInput.focus();

        // Mark messages as read when thread is opened
        var csrfEl = document.getElementById('csrf-token');
        var csrfHeaders = {};
        if (csrfEl) {
            csrfHeaders[csrfEl.name] = csrfEl.value;
        }
        fetch('/messages/' + conversationId + '/read', { method: 'POST', headers: csrfHeaders })
            .then(r => r.json())
            .then(data => {
                // Update badge on this page's FAB if present
                updateChatBadge(data.unreadCount);
            })
            .catch(() => {});
    })();
    </script>
</body>
</html>
