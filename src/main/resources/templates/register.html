<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account — AuctionHouse')}"></head>
<body class="bg-g-bg font-roboto text-g-text min-h-screen flex flex-col">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-g-sm border border-g-border p-8 sm:p-10">
            <div class="text-center mb-8">
                <div class="w-12 h-12 mx-auto mb-4 bg-g-blue rounded-2xl flex items-center justify-center">
                    <span class="material-icons-outlined text-white text-2xl">person_add</span>
                </div>
                <h1 class="font-gsans text-2xl font-medium text-g-text">Create your account</h1>
                <p class="text-sm text-g-text-secondary mt-1">Start with $100,000 demo balance</p>
            </div>

            <div th:if="${error}" class="flex items-center gap-3 p-4 mb-6 bg-red-50 rounded-2xl border border-red-200">
                <span class="material-icons-outlined text-g-red text-xl">error</span>
                <span class="text-sm text-red-800" th:text="${error}">Error</span>
            </div>

            <form th:action="@{/register}" th:object="${userDTO}" method="post" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Username</label>
                    <input type="text" th:field="*{username}" required
                           pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only — no spaces"
                           maxlength="30" autocomplete="username"
                           class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                           placeholder="Choose a username" id="regUsername">
                    <p class="text-xs text-g-text-secondary mt-1" id="usernameHint">Letters, numbers, and underscores only</p>
                    <p class="text-xs text-g-red mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Email</label>
                    <input type="email" th:field="*{email}" required
                           class="w-full px-4 py-3 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                           placeholder="your@email.com">
                    <p class="text-xs text-g-red mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" th:field="*{password}" required id="regPassword"
                               class="w-full px-4 py-3 pr-11 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                               placeholder="Minimum 6 characters">
                        <button type="button" onclick="togglePassword('regPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-g-text-secondary hover:text-g-text transition-colors p-1">
                            <span class="material-icons-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                    <p class="text-xs text-g-red mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-g-text mb-1.5">Confirm password</label>
                    <div class="relative">
                        <input type="password" th:field="*{confirmPassword}" required id="regConfirmPassword"
                               class="w-full px-4 py-3 pr-11 bg-white border border-g-border rounded-xl text-sm text-g-text placeholder-g-text-secondary focus:outline-none focus:border-g-blue focus:ring-2 focus:ring-g-blue/20 transition-all"
                               placeholder="Repeat your password">
                        <button type="button" onclick="togglePassword('regConfirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-g-text-secondary hover:text-g-text transition-colors p-1">
                            <span class="material-icons-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                    <p class="text-xs text-g-red mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>
                <button type="submit" class="w-full py-3.5 bg-g-blue text-white font-medium rounded-xl hover:bg-g-blue-hover shadow-g-sm hover:shadow-g-md transition-all text-sm">
                    Create account
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-g-text-secondary">Already have an account? <a th:href="@{/login}" class="text-g-blue font-medium hover:underline">Sign in</a></p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // Prevent spaces in username (real-time)
    var usernameInput = document.getElementById('regUsername');
    if (usernameInput) {
        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === ' ') e.preventDefault();
        });
        usernameInput.addEventListener('input', function() {
            // Remove any spaces or invalid chars that got pasted
            this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
        });
        usernameInput.addEventListener('paste', function(e) {
            e.preventDefault();
            var paste = (e.clipboardData || window.clipboardData).getData('text');
            this.value += paste.replace(/[^a-zA-Z0-9_]/g, '');
        });
    }

    // Toggle password visibility
    function togglePassword(inputId, btn) {
        var input = document.getElementById(inputId);
        var icon = btn.querySelector('.material-icons-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }
</script>
